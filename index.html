<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sometimes Yellow Sometimes Green, by Jiabao, 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            width:100%;
            display:flex;
            align-items: center;
            justify-content: center;
            font-family:"Apple Color Emoji";
        }
        #elf{
            font-size: 100px;
            display: none;
        }
        #ELF{
            font-size: 100px;
            display: none;
        }
    </style>
</head>

<body>
    <div id="elf">🧝🏼‍♀️</div>
    <div id="ELF">🧝🏼‍♂️</div>
    <script>
        if(Math.random() < 0.5){
            // green! elf!
            document.body.style.backgroundColor = "#9ACD32";
            document.getElementById("elf").style.display= "block";
        }else{
            // yellow! ELF!
            document.body.style.backgroundColor = "#FFFF00";
            document.getElementById("ELF").style.display= "block";
        }
    </script>
</body>
</html>
